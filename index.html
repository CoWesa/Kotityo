<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chore Keeper</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}
body{background:#f4f6f8;color:#212529;padding:16px;max-width:600px;margin:0 auto}
#loginScreen{background:#fff;padding:30px 20px;border-radius:16px;box-shadow:0 4px 16px rgba(0,0,0,.1);text-align:center;margin-top:40px}
#loginScreen h2{color:#1b4332;margin-bottom:8px}
#loginScreen p{color:#6c757d;font-size:14px;margin-bottom:20px}
#loginInput{width:100%;max-width:280px;padding:12px;border:1px solid #ced4da;border-radius:10px;font-size:16px;text-align:center;margin-bottom:12px}
#loginBtn{width:100%;max-width:280px;background:#1b4332;color:#fff;border:none;padding:12px;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer}
#loginError{color:#dc3545;font-size:14px;margin-top:12px;font-weight:600;display:none}
#appContent{display:none}
.header{background:#1b4332;color:#fff;padding:20px;border-radius:14px;margin-bottom:16px}
.header h1{font-size:22px;margin-bottom:4px}
.header p{font-size:13px;color:#b7e4c7}
.top-actions{display:flex;gap:10px;margin-bottom:16px}
.btn-main{flex:2;background:#2d6a4f;color:#fff;border:none;padding:12px;border-radius:10px;font-weight:600;font-size:15px;cursor:pointer}
.btn-share{flex:1;background:#e9ecef;color:#212529;border:none;padding:12px;border-radius:10px;font-weight:600;font-size:15px;cursor:pointer}
.tabs{display:flex;gap:8px;margin-bottom:16px;background:#e9ecef;padding:4px;border-radius:10px}
.tab-btn{flex:1;padding:10px;border:none;border-radius:8px;font-weight:600;font-size:14px;background:transparent;color:#495057;cursor:pointer}
.tab-btn.active{background:#fff;color:#1b4332}
.reminder{background:#fff3cd;color:#856404;border:1px solid #ffeeba;padding:12px;border-radius:10px;margin-bottom:16px;font-size:14px;display:none}
.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:12px;border-left:5px solid #2d6a4f;box-shadow:0 2px 6px rgba(0,0,0,.05)}
.card.high{border-left-color:#dc3545}
.card.low{border-left-color:#6c757d}
.card.overdue{background:#fff8f8;border:1px solid #f5c2c7;border-left:5px solid #dc3545}
.card.done-card{opacity:.75;border-left-color:#adb5bd}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.badge{background:#f1f3f5;color:#495057;font-size:12px;padding:4px 8px;border-radius:6px;font-weight:500}
.badge.user{background:#e8f5e9;color:#1b4332}
.card-title{font-size:17px;font-weight:600;margin-bottom:4px}
.card-desc{font-size:14px;color:#6c757d;margin-bottom:12px}
.card-buttons{display:flex;gap:8px;margin-top:12px}
.c-btn{padding:8px 12px;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer}
.btn-ok{flex:2;background:#d8f3dc;color:#1b4332}
.btn-edit{flex:1;background:#f1f3f5;color:#495057}
.btn-del{background:#ffe3e3;color:#c92a2a}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:100}
.modal-overlay.open{display:flex}
.modal-box{background:#fff;width:100%;max-width:440px;border-radius:16px;padding:20px;max-height:90vh;overflow-y:auto}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.close-btn{background:none;border:none;color:#6c757d;font-size:22px;font-weight:700;cursor:pointer}
.form-group{margin-bottom:12px}
.form-row{display:flex;gap:10px;margin-bottom:12px}
.form-row>div{flex:1}
label{display:block;font-size:13px;font-weight:600;margin-bottom:4px;color:#495057}
input,select{width:100%;padding:10px;border:1px solid #ced4da;border-radius:8px;font-size:15px;background:#fff}
.btn-save{width:100%;background:#1b4332;color:#fff;border:none;padding:12px;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer;margin-top:8px}
</style>
</head>
<body>

<div id="loginScreen">
  <h2>🔒 Chore Keeper</h2>
  <p>Anna perheen salasana avataksesi työlistan</p>
  <input type="password" id="loginInput" placeholder="Salasana" onkeydown="if(event.key==='Enter')document.getElementById('loginBtn').click()">
  <br>
  <button type="button" id="loginBtn" onclick="if(document.getElementById('loginInput').value.trim()==='Var2026'){sessionStorage.setItem('choreAuth','ok');document.getElementById('loginScreen').style.display='none';document.getElementById('appContent').style.display='block';if(window.initApp)initApp();}else{document.getElementById('loginError').style.display='block';}">Avaa työlista</button>
  <div id="loginError">⛔ Väärä salasana, yritä uudelleen.</div>
</div>

<div id="appContent">
  <div class="header"><h1>🌲 Chore Keeper</h1><p>Talouden työlista (v8.1)</p></div>
  <div class="top-actions">
    <button type="button" id="openAddBtn" class="btn-main" onclick="document.getElementById('modalTitle').textContent='Lisää uusi työ';document.getElementById('editIndex').value='';document.getElementById('tTitle').value='';document.getElementById('tDesc').value='';document.getElementById('tStartDate').value=new Date().toISOString().split('T')[0];document.getElementById('tEndDate').value='';document.getElementById('tTime').value='17:00';document.getElementById('tWho').value='';document.getElementById('tPrio').value='medium';document.getElementById('tRepeat').value='once';document.getElementById('modalAdd').classList.add('open');">➕ Lisää uusi työ</button>
    <button type="button" id="openShareBtn" class="btn-share" onclick="document.getElementById('modalShare').classList.add('open');">🔗 Jaa</button>
  </div>
  <div id="reminderBox" class="reminder"></div>
  <div class="tabs">
    <button type="button" id="tabTodo" class="tab-btn active" onclick="activeTab='todo';this.className='tab-btn active';document.getElementById('tabDone').className='tab-btn';if(window.renderAll)renderAll();">Tekemättömät (0)</button>
    <button type="button" id="tabDone" class="tab-btn" onclick="activeTab='done';this.className='tab-btn active';document.getElementById('tabTodo').className='tab-btn';if(window.renderAll)renderAll();">Kuitatut työt (0)</button>
  </div>
  <div id="taskList"></div>
</div>

<div id="modalAdd" class="modal-overlay">
  <div class="modal-box">
    <div class="modal-header"><h2 id="modalTitle">Lisää uusi työ</h2><button type="button" class="close-btn" onclick="document.getElementById('modalAdd').classList.remove('open');">✕</button></div>
    <input type="hidden" id="editIndex">
    <div class="form-group"><label for="tTitle">Työn nimi *</label><input type="text" id="tTitle" placeholder="Esim. Imurointi"></div>
    <div class="form-group"><label for="tDesc">Lisätiedot</label><input type="text" id="tDesc" placeholder="Tarkemmat ohjeet"></div>
    <div class="form-row">
      <div><label for="tStartDate">Aloituspäivä</label><input type="date" id="tStartDate"></div>
      <div><label for="tEndDate">Päättymispäivä</label><input type="date" id="tEndDate"></div>
    </div>
    <div class="form-row">
      <div><label for="tTime">Kellonaika</label><input type="time" id="tTime" value="17:00"></div>
      <div><label for="tWho">Tekijä</label><input type="text" id="tWho" placeholder="Nimi"></div>
    </div>
    <div class="form-row">
      <div><label for="tPrio">Kiireellisyys</label><select id="tPrio"><option value="low">Matala</option><option value="medium" selected>Normaali</option><option value="high">Kiireellinen</option></select></div>
      <div><label for="tRepeat">Toistuvuus</label><select id="tRepeat"><option value="once" selected>Kertaluontoinen</option><option value="daily">🔄 Päivittäinen</option><option value="weekly">📅 Viikoittainen</option></select></div>
    </div>
    <button type="button" id="saveBtn" class="btn-save" onclick="var t=document.getElementById('tTitle').value.trim();if(!t){alert('Anna työlle nimi!');return;}var sd=document.getElementById('tStartDate').value,ed=document.getElementById('tEndDate').value;if(sd&&ed&&ed<sd){alert('Päättymispäivä ei voi olla ennen aloituspäivää!');return;}var idx=document.getElementById('editIndex').value,ex=idx!==''?tasks[Number(idx)]:null;var obj={title:t,desc:document.getElementById('tDesc').value.trim(),startDate:sd,endDate:ed,time:document.getElementById('tTime').value,who:document.getElementById('tWho').value.trim(),prio:document.getElementById('tPrio').value,repeat:document.getElementById('tRepeat').value,done:ex?ex.done:false,doneAt:ex?ex.doneAt:''};if(idx!=='')tasks[Number(idx)]=obj;else tasks.push(obj);document.getElementById('modalAdd').classList.remove('open');localStorage.setItem('choreV8',JSON.stringify(tasks));if(window.renderAll)renderAll();else location.reload();">Tallenna työ</button>
  </div>
</div>

<div id="modalShare" class="modal-overlay">
  <div class="modal-box">
    <div class="modal-header"><h2>Jaa työlista</h2><button type="button" class="close-btn" onclick="document.getElementById('modalShare').classList.remove('open');">✕</button></div>
    <p style="font-size:14px;color:#495057;margin-bottom:16px">Kopioi linkki ja lähetä se viestillä perheenjäsenelle.</p>
    <button type="button" class="btn-save" onclick="navigator.clipboard.writeText(window.location.origin+window.location.pathname+'#data='+btoa(encodeURIComponent(JSON.stringify(tasks)))).then(function(){alert('Jakolinkki kopioitu!');document.getElementById('modalShare').classList.remove('open');});">📋 Kopioi jakolinkki</button>
  </div>
</div>

<script>
var tasks=[],activeTab="todo";
if(sessionStorage.getItem("choreAuth")==="ok"){document.getElementById("loginScreen").style.display="none";document.getElementById("appContent").style.display="block";}
function getTodayISO(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function formatDateFI(s){if(!s)return"";var p=s.split("-");return p.length===3?Number(p.at(2))+"."+Number(p.at(1))+"."+p.at(0):s;}
function initApp(){try{var h=window.location.hash;if(h&&h.indexOf("#data=")===0){tasks=JSON.parse(decodeURIComponent(atob(h.substring(6))));localStorage.setItem("choreV8",JSON.stringify(tasks));history.replaceState(null,null," ");}else{var s=localStorage.getItem("choreV8");tasks=s?JSON.parse(s):[];}}catch(e){tasks=[];}renderAll();}
function saveAll(){try{localStorage.setItem("choreV8",JSON.stringify(tasks));}catch(e){}renderAll();}
function getNow(){var d=new Date();return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");}
function isOverdue(t,td,nw){var c=t.endDate||t.startDate;return !c?t.time<nw:c<td||(c===td&&t.time<nw);}
function tallenna(){
  var title=document.getElementById("tTitle").value.trim();if(!title){alert("Anna työlle nimi!");return;}
  var sd=document.getElementById("tStartDate").value,ed=document.getElementById("tEndDate").value;
